<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>The Void</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Using Bootstrap 5 framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="index.js"></script>
    <style>
        body {
            background-color: black;
            margin: 0;
        }

        .ambience-toggle {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, background 0.15s ease;
            padding: 0;
        }

        .ambience-toggle:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: scale(1.04);
        }

        .ambience-toggle img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <button id="ambienceToggle" class="ambience-toggle" type="button" aria-label="Toggle ambience audio">
        <img id="ambienceIcon" src="images/speakeron.png" alt="Speaker on">
    </button>
    <audio id="ambienceAudio" loop autoplay src="audio/ambience.mp3"></audio>

    <div class="container justify-content-center text-align-center">
        <div>
            <img src="images/thepoem.jpg" height="2000" width="2000" class="img-fluid">
        </div>
    </div>

    <script>
        const ambienceAudio = document.getElementById('ambienceAudio');
        const ambienceToggle = document.getElementById('ambienceToggle');
        const ambienceIcon = document.getElementById('ambienceIcon');

        function updateAmbienceButton() {
            const isMuted = ambienceAudio.muted;
            ambienceIcon.src = isMuted ? 'images/speakeroff.png' : 'images/speakeron.png';
            ambienceIcon.alt = isMuted ? 'Speaker off' : 'Speaker on';
            ambienceToggle.setAttribute('aria-label', isMuted ? 'Unmute ambience audio' : 'Mute ambience audio');
        }

        ambienceAudio.muted = false;
        ambienceAudio.play().catch(() => {});
        updateAmbienceButton();

        ambienceToggle.addEventListener('click', () => {
            ambienceAudio.muted = !ambienceAudio.muted;
            updateAmbienceButton();

            if (!ambienceAudio.muted) {
                ambienceAudio.play().catch(() => {});
            }
        });
    </script>
</body>
</html>
